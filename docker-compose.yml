services:
  postgres:
    image: postgres:17-alpine
    container_name: bevd-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bevd
      POSTGRES_PASSWORD: bevd
      POSTGRES_DB: bevd
    # Loopback only. A bare "5432:5432" listens on every interface, which puts a
    # database with a password written in this file on the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevd -d bevd"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The feed cache and the idempotency ledger. No persistence: losing the cache costs a
  # query, losing the ledger shortens the retry horizon.
  redis:
    image: redis:8-alpine
    container_name: bevd-base-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Loopback only: this Redis has no password at all.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
